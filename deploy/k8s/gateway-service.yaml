apiVersion: v1
kind: Service
metadata:
  name: flarehouse-gateway
  namespace: analytics-platform
  labels:
    app.kubernetes.io/name: flarehouse-gateway
    app.kubernetes.io/part-of: flarehouse
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "8080"
spec:
  type: ClusterIP
  selector:
    app: flarehouse-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
